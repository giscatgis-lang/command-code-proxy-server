services:
  command-code-proxy:
    build: .
    container_name: command-code-proxy-server
    ports:
      - "55990:55990"
    # environment:
      # 可选：设置默认 API Key（也可以通过命令行参数传递）
      # API_KEY: your-commandcode-api-key
    command: ["-host", "0.0.0.0", "-port", "55990"]
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    driver: bridge
